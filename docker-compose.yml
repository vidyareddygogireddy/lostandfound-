services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: laf-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: laf
      MYSQL_ROOT_PASSWORD: Vidya@143
      MYSQL_USER: Vidya143
      MYSQL_PASSWORD: Vidya@143
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pVidya@143"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Spring Boot Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: laf-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/laf?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: Vidya143
      SPRING_DATASOURCE_PASSWORD: Vidya@143
      JWT_SECRET: 94a08da1fecbb6e8b46990538c7b50b240ce4d93e78df794bdf34a5d4a13e2e0
      JWT_EXPIRATION: 86400000
      UPLOAD_DIR: /app/uploads
      PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - uploads_data:/app/uploads

  # React Frontend (Nginx Reverse Proxy) Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: laf-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
      - "3000:80"

volumes:
  mysql_data:
  uploads_data:
